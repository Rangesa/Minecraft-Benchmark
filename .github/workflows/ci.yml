name: MineBench CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate Rust formatting
        run: cargo fmt --all -- --check

      - name: Build Fabric Adapter
        shell: pwsh
        run: .\gradlew.bat build --no-daemon

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace -- --test-threads=1

      - name: Build Windows release
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload MineBench.exe
        uses: actions/upload-artifact@v4
        with:
          name: MineBench-windows
          path: |
            dist/MineBench.exe
            dist/MineBench.exe.sha256
