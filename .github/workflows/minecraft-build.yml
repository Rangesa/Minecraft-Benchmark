name: Minecraft compatibility builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.1.1", "26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and verify the exact Adapter
        run: python3 scripts/build_versions.py --version '${{ matrix.minecraft }}'
      - uses: actions/upload-artifact@v7
        with:
          name: adapter-${{ matrix.minecraft }}
          path: build/versions/${{ matrix.minecraft }}/*.jar
          if-no-files-found: error
  launcher:
    needs: adapter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v8
        with:
          pattern: adapter-*
          path: downloaded-adapters
      - name: Arrange versioned Adapter JARs
        shell: pwsh
        run: |
          Get-ChildItem downloaded-adapters -Directory | ForEach-Object {
            $version = $_.Name.Substring('adapter-'.Length)
            $destination = Join-Path 'build/versions' $version
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item (Join-Path $_.FullName '*.jar') $destination
          }
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test launcher and file protocol
        run: cargo test --workspace --locked
      - name: Build the launcher with all Adapters
        run: cargo build -p minebench-launcher --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: MineBench-Windows
          path: target/release/minebench.exe
          if-no-files-found: error
